clickhouse:
  user: "default"
  host: "192.168.28.210"
  port: 9000
  passwd: ""
  database: "infinity_market"

tdx:
  root: "data"

runtime:
  timezone: "Asia/Shanghai"
  batch_size: 10000

logging:
  level: "info"
  encoding: "console"
  output_paths: ["stderr", "file"]
  error_output_paths: ["stderr"]
  file:
    path: "logs/marketd.log"
    max_size_mb: 100
    max_backups: 7
    max_age_days: 30
    compress: true
