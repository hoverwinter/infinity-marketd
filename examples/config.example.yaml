clickhouse:
  addr: "127.0.0.1:9000"
  user: "default"
  password: ""
  databases:
    market: "infinity_market"
    ops: "infinity_ops"

tdx:
  root: "~/tdx-data"

runtime:
  timezone: "Asia/Shanghai"
  batch_size: 10000

logging:
  level: "info"
  encoding: "json"
  output_paths: ["stderr", "file"]
  error_output_paths: ["stderr"]
  file:
    path: "logs/marketd.log"
    max_size_mb: 100
    max_backups: 7
    max_age_days: 30
    compress: true
